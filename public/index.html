<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eurasia Endüstriyel Enerji</title>
    <!-- No middleware runs on a static export, so the locale-less root redirects
         here on the client. Relative URLs keep this working under any basePath. -->
    <script>
      (function () {
        var lang = (navigator.language || "tr").toLowerCase();
        var locale = lang.indexOf("en") === 0 ? "en" : lang.indexOf("de") === 0 ? "de" : "tr";
        location.replace(locale + "/");
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=tr/" />
    <link rel="canonical" href="https://scemresahin.github.io/eurasiaee/tr/" />
  </head>
  <body>
    <p>Yönlendiriliyor… / Redirecting… <a href="tr/">Eurasia Endüstriyel Enerji</a></p>
  </body>
</html>
